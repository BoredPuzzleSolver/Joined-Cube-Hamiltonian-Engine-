name: Tests and package build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      research:
        description: Run independent research and exact certificate checks
        type: boolean
        default: false

env:
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run routine tests
        run: python -m pytest
      - name: Run independent research checks
        if: github.event_name == 'workflow_dispatch' && inputs.research
        run: python -m pytest --run-research -m research
      - name: Build source and wheel distributions
        run: python -m build
      - name: Install the wheel
        run: python -c "import pathlib, subprocess, sys; wheel = next(pathlib.Path('dist').glob('*.whl')); subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--force-reinstall', '--no-deps', str(wheel)])"
      - name: Verify installed package and bundled data
        run: python -I -c "from terry_cubes import __version__; from terry_cubes.data import load_spectra, list_research_datasets, load_research_dataset; assert __version__ == '0.1.1'; assert all(load_spectra(n)['model']['num_cubes'] == n for n in (1, 2, 3)); assert len(list_research_datasets()) == 7; [load_research_dataset(x['name']) for x in list_research_datasets()]; print('Installed wheel and all ten research datasets loaded successfully.')"
      - name: Test installed wheel outside the source checkout
        run: >-
          python -c
          "import pathlib, shutil, subprocess, sys, tempfile;
          root = pathlib.Path.cwd();
          target = pathlib.Path(tempfile.mkdtemp(prefix='terry-cubes-installed-tests-'));
          shutil.copytree(root / 'tests', target / 'tests');
          shutil.copytree(root / 'data', target / 'data');
          shutil.copy2(root / 'SOURCE_PROVENANCE.json', target / 'SOURCE_PROVENANCE.json');
          shutil.copy2(root / 'RELEASE_PROVENANCE.json', target / 'RELEASE_PROVENANCE.json');
          subprocess.check_call([sys.executable, '-I', '-m', 'pytest', '-q', str(target / 'tests')], cwd=target)"
      - name: Verify command-line entry point
        working-directory: ${{ runner.temp }}
        run: terry-cubes --help
